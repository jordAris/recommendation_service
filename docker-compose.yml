version: '4.16.2'
services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra_RecommederService
    ports:
      - 9042:9042
    environment:
      - CASSANDRA_CLUSTER_NAME=my_cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_SEEDS=cassandra
    volumes:
      - ./data:/var/lib/cassandra